[project]
name = "coin-v8-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.5.3", "scipy==1.18.1", "polars==1.44.2", "pyarrow==23.0.1",
  "scikit-learn==1.9.1", "xgboost-cpu==3.4.1", "lightgbm==4.7.0",
  "httpx==0.28.1", "websockets==16.1.1", "torch==2.7.1+cpu",
  "pytorch-tcn==1.2.3", "river==0.26.1", "einops==0.8.2",
  "narwhals==2.26.0", "pytest==9.1.1", "ruff==0.16.9",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
