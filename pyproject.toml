[project]
name = "coin-quant"
version = "0.1.0"
description = "Reproducible Binance minute/hour research and read-only monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3", "polars>=1.30,<2", "pyarrow>=20,<24",
  "scikit-learn>=1.6,<2", "httpx>=0.28,<1", "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--capture=sys"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

